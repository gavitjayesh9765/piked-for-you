[project]
name = "pickdforyou-api"
version = "0.1.0"
description = "PickDForYou — product research and recommendation API"
requires-python = ">=3.11"

dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "email-validator>=2.2.0",
  # Database — Supabase Postgres. Schema lives in supabase/migrations/,
  # applied with the Supabase CLI; SQLAlchemy is used for querying only.
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  # Auth — verification only. Supabase Auth owns passwords, sessions and MFA,
  # so there is no password hashing library here and nothing to misconfigure.
  # [crypto] pulls in `cryptography`, required for ES256 — Supabase issues
  # asymmetric tokens now, and without it every valid token is rejected.
  "pyjwt[crypto]>=2.10.0",
  # Supabase Storage + Auth admin API
  "httpx>=0.28.0",
  # Media handling — real validation needs to decode the file, not trust it.
  # Pillow IS that validation (app/modules/admin/media.py): a file that
  # decodes as an image is an image, which is a stronger claim than any
  # header sniff. Deliberately no python-magic: it was declared here and
  # imported nowhere, and it binds to libmagic — a system library pip cannot
  # install, which is the only thing that made this app need a Dockerfile.
  "python-multipart>=0.0.12",
  "pillow>=11.0.0",
  # Rate limiting / caching
  "redis>=5.2.0",
  "slowapi>=0.1.9",
  # Price scraping — HTML parsing. beautifulsoup4 runs on the stdlib
  # html.parser, so there is no compiled dependency to build on a deploy box;
  # it picks up lxml automatically if something else pulls it in.
  "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
# Headless rendering for the handful of storefronts that build their price in
# JavaScript. Optional on purpose: it pulls a browser stack, and the http
# engine covers every retailer we ship with. Install with
#   pip install -e ".[scraping]" && crawl4ai-setup
scraping = [
  "crawl4ai>=0.4.0",
]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "aiosqlite>=0.20.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is the documented idiom

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
