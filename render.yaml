# Render Blueprint — PickDForYou API.
#
# Infrastructure as code so the deploy is reproducible and you are never one
# suspended account away from re-clicking a dashboard from memory. Create the
# service with: Render Dashboard -> New -> Blueprint -> point at this repo.
#
# ---------------------------------------------------------------------------
# PLAN: `free` WHILE BUILDING, `starter` BEFORE LAUNCH
#
# Free is set deliberately, and it is a temporary setting. It is fine right
# now — nobody is using the site, so a cold start costs you a minute of your
# own time and nothing else. It stops being fine the moment real users arrive.
#
# What Free costs you:
#   - SPIN-DOWN after 15 minutes idle, then ~1 minute to wake. A first-time
#     visitor sees a loading page for a minute. That is the whole ballgame for
#     an affiliate site: they leave.
#   - 750 INSTANCE-HOURS/month, and Render's docs are explicit that
#     "spun-down services don't consume Free instance hours" — the tier only
#     adds up BECAUSE services sleep. A month is ~730 hours, so a keep-alive
#     ping spends ~730 of the 750 and leaves ~20 hours of headroom for the
#     whole month. Redeploys eat that, then the service is suspended until
#     the 1st. This is why the ping plan was abandoned; it is arithmetic.
#   - EPHEMERAL FILESYSTEM, wiped on every restart. Harmless here only
#     because uploads go to Supabase Storage — keep it that way.
#   - Price-scrape BackgroundTasks DIE if the instance spins down mid-run.
#     Do not kick off a long scrape and walk away while on Free.
#   - Render states plainly that Free is "not for production applications",
#     and this one takes affiliate revenue.
#
# Switching later is this one line plus a redeploy. Set a reminder.
#
# REGION: Render has no India region (Oregon, Ohio, Virginia, Frankfurt,
# Singapore). Singapore is the closest to Supabase ap-south-1 at ~55-75ms.
# If Render rejects `singapore` on the Free plan, do NOT silently fall back
# to Oregon — that is ~230ms to the database on every server-rendered
# request. Move to Starter instead, or rethink the host.
# ---------------------------------------------------------------------------

services:
  - type: web
    name: pickdforyou-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend

    # Closest region to Supabase ap-south-1 (Mumbai) that Render offers:
    # ~55-75ms. Oregon would be ~230ms, and every SSR page render makes
    # several sequential API calls, so that difference compounds per request.
    region: singapore
    # ⚠ FLIP THIS TO `starter` BEFORE YOU LAUNCH. See the note above.
    plan: free

    healthCheckPath: /health

    # Zero-downtime deploys. Render holds the old instance until the new one
    # passes healthCheckPath, which matters because an in-flight price-scrape
    # BackgroundTask on the old instance is not restartable.
    autoDeploy: true

    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"

      # --- Supabase. Set every one of these in the Render dashboard under
      #     Environment -> Secret. `sync: false` means Render prompts for the
      #     value and never stores it in this file. ---
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # BYPASSES ROW LEVEL SECURITY. Belongs here and nowhere else — never in
      # any NEXT_PUBLIC_ variable on the Vercel side.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false

      # --- Database ---
      # Use Supabase's SESSION pooler (port 5432), not the transaction pooler
      # (6543). app/db/session.py builds a SQLAlchemy pool with pool_pre_ping
      # and does not disable prepared statements; asyncpg emits those, and
      # pgbouncer in transaction mode rejects them. See docs/07-deployment.md.
      - key: DATABASE_URL
        sync: false

      # 512MB instance, one uvicorn worker. The default 10+20 opens up to 30
      # connections against a Supabase free project that does not have 30 to
      # give. Trimmed to match the actual concurrency of a single worker.
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"

      # --- CORS. Must list the real frontend origin; a wrong value here fails
      #     only in the browser, which makes it look like a frontend bug. ---
      - key: CORS_ORIGINS
        sync: false

      - key: REQUIRE_ADMIN_MFA
        value: "true"
