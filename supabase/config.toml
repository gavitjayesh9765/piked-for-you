project_id = "pickdforyou"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
# Hard cap on PostgREST rows. Our API paginates anyway, but this stops an
# unbounded query from ever being possible.
max_rows = 100

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

# Catches outbound mail locally so confirmation and reset flows can be tested
# without sending anything to a real address.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]

# Short-lived access tokens; refresh rotation limits the value of a stolen one.
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

# Public signup is for shoppers only. Admins are never created this way —
# see docs/05-admin-setup.md.
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
# Supabase minimum is 6; the API enforces a longer minimum on top of this.
max_frequency = "60s"

# --- Branded auth emails -----------------------------------------------------
#
# Every template below is GENERATED by `node supabase/templates/build.mjs` from
# a single layout. Edit the builder, not the HTML.
#
# This section drives the LOCAL stack only — config.toml does not sync to the
# hosted project, whose templates are separate dashboard state. Push the same
# files to the remote with `supabase/scripts/push-email-templates.sh` so the two
# never drift, and `--check` in CI to catch a stale build.

[auth.email.template.confirmation]
subject = "Confirm your email address"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your PickDForYou password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "Your PickDForYou sign-in link"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.email_change]
subject = "Confirm your new email address"
content_path = "./supabase/templates/email_change.html"

# Unused today — admins are created by hand (docs/05-admin-setup.md) and there
# is no invite endpoint. Branded anyway so that Dashboard → Invite user can
# never send the stock email by accident.
[auth.email.template.invite]
subject = "You have been invited to PickDForYou"
content_path = "./supabase/templates/invite.html"

# The code goes in the subject so it is readable from a notification.
[auth.email.template.reauthentication]
subject = "{{ .Token }} is your PickDForYou verification code"
content_path = "./supabase/templates/reauthentication.html"

# --- Security notifications --------------------------------------------------
#
# Sent after the fact — "your password was changed", "a sign-in method was
# added". Left DISABLED so that wiring up the templates does not by itself
# start sending mail no one has signed off on. Flip `enabled` here for local,
# and pass --enable-notifications to the push script for the hosted project.

[auth.email.notification.password_changed]
enabled = false
subject = "Your PickDForYou password was changed"
content_path = "./supabase/templates/password_changed.html"

[auth.email.notification.email_changed]
enabled = false
subject = "Your PickDForYou email address was changed"
content_path = "./supabase/templates/email_changed.html"

[auth.email.notification.phone_changed]
enabled = false
subject = "Your PickDForYou phone number was changed"
content_path = "./supabase/templates/phone_changed.html"

[auth.email.notification.mfa_factor_enrolled]
enabled = false
subject = "A new verification method was added to your PickDForYou account"
content_path = "./supabase/templates/mfa_factor_enrolled.html"

[auth.email.notification.mfa_factor_unenrolled]
enabled = false
subject = "A verification method was removed from your PickDForYou account"
content_path = "./supabase/templates/mfa_factor_unenrolled.html"

[auth.email.notification.identity_linked]
enabled = false
subject = "A sign-in method was linked to your PickDForYou account"
content_path = "./supabase/templates/identity_linked.html"

[auth.email.notification.identity_unlinked]
enabled = false
subject = "A sign-in method was removed from your PickDForYou account"
content_path = "./supabase/templates/identity_unlinked.html"

[auth.mfa]
max_enrolled_factors = 3

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[analytics]
enabled = false
